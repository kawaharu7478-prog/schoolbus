<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス走行位置表示 & 運用投稿</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    #currentTime {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 20px;
      color: #333;
      z-index: 10;
    }

    /* 運用投稿・確認エリア（左下） */
    #postContainer {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #ddd;
    }

    .post-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .post-row label {
      font-size: 14px;
      font-weight: bold;
      width: 35px;
    }

    select {
      padding: 6px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .v-btn {
      background: orange;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .submit-btn {
      background: #333;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      margin-top: 5px;
    }

    .v-btn:active, .submit-btn:active {
      transform: translateY(1px);
    }

    .map {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-line {
      position: relative;
      width: 16px;
      height: 90vh;
      background-color: orange;
      border-radius: 4px;
    }

    .stop {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      background: white;
      padding: 3px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: nowrap;
    }

    .bus {
      position: absolute;
      width: 80px;
      transition: top 1s linear;
      cursor: default;
      pointer-events: none; 
    }

    .left { left: calc(50% - 130px); }
    .right { left: calc(50% + 100px); }

    /* ドロワーUI */
    #bottomSheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 75vh;
      background: white;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
      z-index: 2000;
      transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
    }

    #drawerHandle {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #drawerHandle span {
      width: 40px;
      height: 5px;
      background: #ccc;
      border-radius: 5px;
    }

    #drawerScrollArea {
      padding: 0 20px 20px;
      overflow-y: auto;
      flex: 1;
    }

    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1500;
    }
  </style>
</head>
<body>

  <div id="currentTime"></div>

  <div id="postContainer">
    <div style="font-size: 14px; font-weight: bold; border-bottom: 2px solid orange; padding-bottom: 5px; margin-bottom: 5px;">運用管理</div>
    <div class="post-row">
      <label>1便:</label>
      <select id="select-trip1">
        <option value="不明">不明</option>
        <option value="2694">2694</option>
        <option value="2995">2995</option>
        <option value="ガーラ">ガーラ</option>
        <option value="ふそう">ふそう</option>
      </select>
      <button class="v-btn" onclick="openDrawer('1便')">運用を見る</button>
    </div>
    <div class="post-row">
      <label>2便:</label>
      <select id="select-trip2">
        <option value="不明">不明</option>
        <option value="2694">2694</option>
        <option value="2995">2995</option>
        <option value="ガーラ">ガーラ</option>
        <option value="ふそう">ふそう</option>
      </select>
      <button class="v-btn" onclick="openDrawer('2便')">運用を見る</button>
    </div>
    <button class="submit-btn" onclick="saveUnyou()">変更を投稿する</button>
  </div>

  <div class="map" id="mapContainer">
    <div class="center-line" id="line"></div>
    <div class="stop" style="top:10%;">広島工大</div>
    <div class="stop" style="top:55%;">五日市駅南口</div>
    <div class="stop" style="top:80%;">車庫</div>
  </div>

  <div id="overlay" onclick="closeDrawer()"></div>
  <div id="bottomSheet">
    <div id="drawerHandle" onclick="closeDrawer()"><span></span></div>
    <div id="drawerScrollArea">
      <h3 id="drawerTitle" style="margin: 0 0 15px; border-bottom: 2px solid orange; padding-bottom: 10px;">車両詳細</h3>
      <div id="drawerContent">
        <img id="drawerImage" src="" style="width: 100%; height: auto; border-radius: 8px; display: block;">
      </div>
    </div>
  </div>

  <script>
    const vehicleImages = {
      "2694": "2694.png",
      "2995": "2995.png",
      "ガーラ": "3000.png",
      "ふそう": "2020.png",
      "不明": "0000.png"
    };

    // グローバル変数で現在の状態を保持（描画のたびにlocalStorageを読み直さないようにする）
    let currentTrip1 = "不明";
    let currentTrip2 = "不明";

    function updateClock() {
      document.getElementById("currentTime").textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadCSV() {
      const response = await fetch(`timetable.csv?v=${Date.now()}`, { cache: "no-store" });
      return (await response.text()).trim();
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 画面起動時に一度だけ実行する、運用データの初期化関数
    function initUnyouData() {
      const savedDate = localStorage.getItem("unyou_date");
      const today = getTodayString();

      if (savedDate !== today) {
        // 日付が変わっとったら「不明」でリセット
        localStorage.setItem("unyou_date", today);
        localStorage.setItem("unyou_trip1", "不明");
        localStorage.setItem("unyou_trip2", "不明");
        currentTrip1 = "不明";
        currentTrip2 = "不明";
      } else {
        // 同じ日付なら保存データを読み込む
        currentTrip1 = localStorage.getItem("unyou_trip1") || "不明";
        currentTrip2 = localStorage.getItem("unyou_trip2") || "不明";
      }

      // プルダウンの選択状態に反映
      document.getElementById("select-trip1").value = currentTrip1;
      document.getElementById("select-trip2").value = currentTrip2;
    }

    // 投稿ボタンを押した時の処理
    function saveUnyou() {
      const t1 = document.getElementById("select-trip1").value;
      const t2 = document.getElementById("select-trip2").value;
      
      localStorage.setItem("unyou_date", getTodayString());
      localStorage.setItem("unyou_trip1", t1);
      localStorage.setItem("unyou_trip2", t2);
      
      currentTrip1 = t1;
      currentTrip2 = t2;
      
      alert("運用を更新しました。");
      location.reload(); // 再読み込みして最新状態を描画に反映
    }

    // バスアイコンの画像パスを決定する関数（毎秒呼び出される）
    function getBusIcon(bustype) {
      const selectedVehicle = (bustype === "1") ? currentTrip1 : currentTrip2;
      const imageName = vehicleImages[selectedVehicle] || "0000.png";
      return `${imageName}?v=${Date.now()}`;
    }

    function openDrawer(tripName) {
      const sheet = document.getElementById("bottomSheet");
      const overlay = document.getElementById("overlay");
      const drawerImg = document.getElementById("drawerImage");
      const drawerTitle = document.getElementById("drawerTitle");

      const fileName = `${tripName}unyou.png`; 
      
      drawerImg.src = `${fileName}?v=${Date.now()}`;
      drawerTitle.textContent = `${tripName} の運用`;

      sheet.style.bottom = "0";
      overlay.style.display = "block";

      drawerImg.onerror = () => {
        drawerTitle.textContent = `${tripName} の画像が見つかりません (${fileName})`;
      };
    }

    function closeDrawer() {
      document.getElementById("bottomSheet").style.bottom = "-100%";
      document.getElementById("overlay").style.display = "none";
    }

    function parseCSV(csv) {
      const lines = csv.split("\n");
      const header = lines[0].split(",");
      return lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : "");
        return obj;
      });
    }

    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function interpolate(pos1, pos2, t1, t2, now) {
      if (t1 === null || t2 === null || now < Math.min(t1, t2) || now > Math.max(t1, t2)) return null;
      return pos1 + (pos2 - pos1) * ((now - t1) / (t2 - t1));
    }

    function drawBus(busData, nowMinutes) {
      const line = document.getElementById("line");
      const h = line.clientHeight;
      const offset = line.offsetTop;
      const stops = { "広島工大": offset + 0.1*h, "五日市駅南口": offset + 0.55*h, "車庫": offset + 0.8*h };

      busData.forEach((bus, idx) => {
        const dir = bus.direction;
        const route = [
          { s: dir === "up" ? "車庫" : "広島工大", t: timeToMinutes(bus[dir === "up" ? "車庫" : "広島工大"]) },
          { s: "五日市駅南口", t: timeToMinutes(bus["五日市駅南口"]) },
          { s: dir === "up" ? "広島工大" : "車庫", t: timeToMinutes(bus[dir === "up" ? "広島工大" : "車庫"]) }
        ].filter(x => x.t !== null);

        let posY = null;
        for (let i = 0; i < route.length - 1; i++) {
          posY = interpolate(stops[route[i].s], stops[route[i+1].s], route[i].t, route[i+1].t, nowMinutes);
          if (posY !== null) break;
        }

        const existing = document.getElementById(`bus-${idx}`);
        if (!posY) { if (existing) existing.style.display = "none"; return; }

        let busEl = existing || document.createElement("img");
        if (!existing) {
          busEl.id = `bus-${idx}`;
          busEl.className = `bus ${dir === "up" ? "left" : "right"}`;
          document.body.appendChild(busEl);
        }
        busEl.src = getBusIcon(bus.bustype);
        busEl.style.display = "block";
        busEl.style.top = `${posY}px`;
      });
    }

    async function main() {
      // 起動時に【一度だけ】データを読み込み、日付チェックをする
      initUnyouData();
      
      const busData = parseCSV(await loadCSV());
      const tick = () => {
        const n = new Date();
        drawBus(busData, n.getHours()*60 + n.getMinutes() + n.getSeconds()/60);
      };
      tick();
      setInterval(tick, 1000);
    }
    main();
  </script>
</body>
</html>
