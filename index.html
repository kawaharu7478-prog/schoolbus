<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス走行位置表示 & 運用投稿</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    #currentTime {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 20px;
      color: #333;
      z-index: 10;
    }

    /* 運用投稿エリア（左下） */
    #postContainer {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #ddd;
    }

    .post-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .post-row label {
      font-size: 14px;
      font-weight: bold;
      width: 45px;
    }

    select {
      padding: 6px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .v-btn {
      background: orange;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
    }

    .v-btn:active {
      transform: translateY(1px);
    }

    .map {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-line {
      position: relative;
      width: 16px;
      height: 90vh;
      background-color: orange;
      border-radius: 4px;
    }

    .stop {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      background: white;
      padding: 3px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: nowrap;
    }

    .bus {
      position: absolute;
      width: 80px;
      transition: top 1s linear;
      /* タップ時のポップアップ廃止に伴い、カーソルとポインターイベントを無効化 */
      cursor: default;
      pointer-events: none; 
    }

    .left { left: calc(50% - 130px); }
    .right { left: calc(50% + 100px); }
  </style>
</head>
<body>

  <div id="currentTime"></div>

  <div id="postContainer">
    <div style="font-size: 14px; font-weight: bold; border-bottom: 2px solid orange; padding-bottom: 5px; margin-bottom: 5px;">運用投稿</div>
    <div class="post-row">
      <label>1便:</label>
      <select id="select-trip1">
        <option value="不明">不明</option>
        <option value="2694">2694</option>
        <option value="2995">2995</option>
        <option value="ガーラ">ガーラ</option>
        <option value="ふそう">ふそう</option>
      </select>
    </div>
    <div class="post-row">
      <label>2便:</label>
      <select id="select-trip2">
        <option value="不明">不明</option>
        <option value="2694">2694</option>
        <option value="2995">2995</option>
        <option value="ガーラ">ガーラ</option>
        <option value="ふそう">ふそう</option>
      </select>
    </div>
    <button class="v-btn" onclick="saveUnyou()">投稿する</button>
  </div>

  <div class="map" id="mapContainer">
    <div class="center-line" id="line"></div>
    <div class="stop" style="top:10%;">広島工大</div>
    <div class="stop" style="top:55%;">五日市駅南口</div>
    <div class="stop" style="top:80%;">車庫</div>
  </div>

  <script>
    // 車両名と画像ファイルの紐付け設定
    const vehicleImages = {
      "2694": "2694.png",
      "2995": "2995.png",
      "ガーラ": "3000.png",
      "ふそう": "2020.png",
      "不明": "0000.png"
    };

    function updateClock() {
      document.getElementById("currentTime").textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadCSV() {
      const response = await fetch(`timetable.csv?v=${Date.now()}`, { cache: "no-store" });
      return (await response.text()).trim();
    }

    // 今日の日付文字列（YYYY-MM-DD）を取得する関数
    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 保持された運用データを取得（日付が変わっていればリセットして 0000.png にする）
    function getActiveUnyou() {
      const savedDate = localStorage.getItem("unyou_date");
      const today = getTodayString();

      // 日付が違う、またはデータがない場合は「不明（0000.png）」で初期化
      if (savedDate !== today) {
        localStorage.setItem("unyou_date", today);
        localStorage.setItem("unyou_trip1", "不明");
        localStorage.setItem("unyou_trip2", "不明");
        
        // プルダウンの表示も「不明」にリセット
        document.getElementById("select-trip1").value = "不明";
        document.getElementById("select-trip2").value = "不明";
        return { trip1: "不明", trip2: "不明" };
      }

      // 保存されている値があればそれを使い、プルダウンにも反映
      const t1 = localStorage.getItem("unyou_trip1") || "不明";
      const t2 = localStorage.getItem("unyou_trip2") || "不明";
      document.getElementById("select-trip1").value = t1;
      document.getElementById("select-trip2").value = t2;

      return { trip1: t1, trip2: t2 };
    }

    // 投稿ボタンを押した時の処理
    function saveUnyou() {
      const t1 = document.getElementById("select-trip1").value;
      const t2 = document.getElementById("select-trip2").value;
      
      localStorage.setItem("unyou_date", getTodayString());
      localStorage.setItem("unyou_trip1", t1);
      localStorage.setItem("unyou_trip2", t2);
      
      alert("運用を更新しました。");
      // バス画像を即時再描画させるためにリロード、またはメイン処理を再度走らせる
      location.reload();
    }

    // バスアイコンの画像パスを決定する関数
    function getBusIcon(bustype) {
      const unyou = getActiveUnyou();
      // bustypeが"1"なら1便の選択、それ以外なら2便の選択を参照
      const selectedVehicle = (bustype === "1") ? unyou.trip1 : unyou.trip2;
      const imageName = vehicleImages[selectedVehicle] || "0000.png";
      
      // GitHub上のパス（※HTMLと同階層、または相対パスを想定。必要に応じてURLを付与してください）
      return `${imageName}?v=${Date.now()}`;
    }

    function parseCSV(csv) {
      const lines = csv.split("\n");
      const header = lines[0].split(",");
      return lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : "");
        return obj;
      });
    }

    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function interpolate(pos1, pos2, t1, t2, now) {
      if (t1 === null || t2 === null || now < Math.min(t1, t2) || now > Math.max(t1, t2)) return null;
      return pos1 + (pos2 - pos1) * ((now - t1) / (t2 - t1));
    }

    function drawBus(busData, nowMinutes) {
      const line = document.getElementById("line");
      const h = line.clientHeight;
      const offset = line.offsetTop;
      const stops = { "広島工大": offset + 0.1*h, "五日市駅南口": offset + 0.55*h, "車庫": offset + 0.8*h };

      busData.forEach((bus, idx) => {
        const dir = bus.direction;
        const route = [
          { s: dir === "up" ? "車庫" : "広島工大", t: timeToMinutes(bus[dir === "up" ? "車庫" : "広島工大"]) },
          { s: "五日市駅南口", t: timeToMinutes(bus["五日市駅南口"]) },
          { s: dir === "up" ? "広島工大" : "車庫", t: timeToMinutes(bus[dir === "up" ? "広島工大" : "車庫"]) }
        ].filter(x => x.t !== null);

        let posY = null;
        for (let i = 0; i < route.length - 1; i++) {
          posY = interpolate(stops[route[i].s], stops[route[i+1].s], route[i].t, route[i+1].t, nowMinutes);
          if (posY !== null) break;
        }

        const existing = document.getElementById(`bus-${idx}`);
        if (!posY) { if (existing) existing.style.display = "none"; return; }

        let busEl = existing || document.createElement("img");
        if (!existing) {
          busEl.id = `bus-${idx}`;
          busEl.className = `bus ${dir === "up" ? "left" : "right"}`;
          // タップ時ポップアップ（ドロワー）廃止のため、onclickを削除
          document.body.appendChild(busEl);
        }
        busEl.src = getBusIcon(bus.bustype);
        busEl.style.display = "block";
        busEl.style.top = `${posY}px`;
      });
    }

    async function main() {
      // 起動時に一度プルダウンの状態を同期
      getActiveUnyou();
      
      const busData = parseCSV(await loadCSV());
      const tick = () => {
        const n = new Date();
        drawBus(busData, n.getHours()*60 + n.getMinutes() + n.getSeconds()/60);
      };
      tick();
      setInterval(tick, 1000);
    }
    main();
  </script>
</body>
</html>
