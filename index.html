<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス走行位置表示 & 運用ドロワー</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    #currentTime {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 20px;
      color: #333;
      z-index: 10;
    }

    /* 車両選択ボタンエリア：左下に縦並び */
    #vehicleSelector {
      position: fixed;
      bottom: 20px; /* 下からの距離 */
      left: 20px;   /* 左からの距離 */
      display: flex;
      flex-direction: column; /* 縦並びに変更 */
      gap: 10px;    /* ボタン同士の間隔 */
      z-index: 100;
    }

    .v-btn {
      background: orange;
      color: white;
      border: none;
      padding: 12px 18px; /* 少し押しやすく調整 */
      border-radius: 8px; /* 丸みを少し抑えてリストっぽく */
      font-weight: bold;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      min-width: 100px; /* 幅を揃える */
    }

    .v-btn {
      background: orange;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      font-size: 16px;
    }

    .v-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 3px rgba(0,0,0,0.2);
    }

    .map {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-line {
      position: relative;
      width: 16px;
      height: 90vh;
      background-color: orange;
      border-radius: 4px;
    }

    .stop {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      background: white;
      padding: 3px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: nowrap;
    }

    .bus {
      position: absolute;
      width: 80px;
      transition: top 1s linear;
      cursor: pointer;
    }

    .left { left: calc(50% - 130px); }
    .right { left: calc(50% + 100px); }

    /* ドロワーUI */
    #bottomSheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 75vh;
      background: white;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
      z-index: 2000;
      transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
    }

    #drawerHandle {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #drawerHandle span {
      width: 40px;
      height: 5px;
      background: #ccc;
      border-radius: 5px;
    }

    #drawerScrollArea {
      padding: 0 20px 20px;
      overflow-y: auto;
      flex: 1;
    }

    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1500;
    }
  </style>
</head>
<body>

  <div id="currentTime"></div>

  <div id="vehicleSelector">
    <button class="v-btn" onclick="openDrawer('2694')">2694 運用</button>
    <button class="v-btn" onclick="openDrawer('2995')">2995 運用</button>
  </div>

  <div class="map" id="mapContainer">
    <div class="center-line" id="line"></div>
    <div class="stop" style="top:10%;">広島工大</div>
    <div class="stop" style="top:55%;">五日市駅南口</div>
    <div class="stop" style="top:80%;">車庫</div>
  </div>

  <div id="overlay" onclick="closeDrawer()"></div>
  <div id="bottomSheet">
    <div id="drawerHandle" onclick="closeDrawer()"><span></span></div>
    <div id="drawerScrollArea">
      <h3 id="drawerTitle" style="margin: 0 0 15px; border-bottom: 2px solid orange; padding-bottom: 10px;">車両詳細</h3>
      <div id="drawerContent">
        <img id="drawerImage" src="" style="width: 100%; height: auto; border-radius: 8px; display: block;">
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      document.getElementById("currentTime").textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function loadCSV() {
      const response = await fetch(`timetable.csv?v=${Date.now()}`, { cache: "no-store" });
      return (await response.text()).trim();
    }

    function getBusIcon(type) {
      const vId = (type === "1") ? "2995" : "2694";
      return `${vId}.png?v=${Date.now()}`;
    }

    // ドロワーを開く（共通関数）
    function openDrawer(vehicleId) {
      const sheet = document.getElementById("bottomSheet");
      const overlay = document.getElementById("overlay");
      const drawerImg = document.getElementById("drawerImage");
      const drawerTitle = document.getElementById("drawerTitle");

      // 正しいファイル名に合わせること（例：2694unyou.png か 2694_unyou.png か）
      const fileName = `${vehicleId}unyou.png`; 
      
      drawerImg.src = `${fileName}?v=${Date.now()}`;
      drawerTitle.textContent = `${vehicleId} 号車の本日の運用`;

      sheet.style.bottom = "0";
      overlay.style.display = "block";

      drawerImg.onerror = () => {
        drawerTitle.textContent = `${vehicleId} 号車の画像が見つかりません (${fileName})`;
      };
    }

    function closeDrawer() {
      document.getElementById("bottomSheet").style.bottom = "-100%";
      document.getElementById("overlay").style.display = "none";
    }

    function parseCSV(csv) {
      const lines = csv.split("\n");
      const header = lines[0].split(",");
      return lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : "");
        return obj;
      });
    }

    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function interpolate(pos1, pos2, t1, t2, now) {
      if (t1 === null || t2 === null || now < Math.min(t1, t2) || now > Math.max(t1, t2)) return null;
      return pos1 + (pos2 - pos1) * ((now - t1) / (t2 - t1));
    }

    function drawBus(busData, nowMinutes) {
      const line = document.getElementById("line");
      const h = line.clientHeight;
      const offset = line.offsetTop;
      const stops = { "広島工大": offset + 0.1*h, "五日市駅南口": offset + 0.55*h, "車庫": offset + 0.8*h };

      busData.forEach((bus, idx) => {
        const dir = bus.direction;
        const vId = (bus.bustype === "1") ? "2995" : "2694";
        const route = [
          { s: dir === "up" ? "車庫" : "広島工大", t: timeToMinutes(bus[dir === "up" ? "車庫" : "広島工大"]) },
          { s: "五日市駅南口", t: timeToMinutes(bus["五日市駅南口"]) },
          { s: dir === "up" ? "広島工大" : "車庫", t: timeToMinutes(bus[dir === "up" ? "広島工大" : "車庫"]) }
        ].filter(x => x.t !== null);

        let posY = null;
        for (let i = 0; i < route.length - 1; i++) {
          posY = interpolate(stops[route[i].s], stops[route[i+1].s], route[i].t, route[i+1].t, nowMinutes);
          if (posY !== null) break;
        }

        const existing = document.getElementById(`bus-${idx}`);
        if (!posY) { if (existing) existing.style.display = "none"; return; }

        let busEl = existing || document.createElement("img");
        if (!existing) {
          busEl.id = `bus-${idx}`;
          busEl.className = `bus ${dir === "up" ? "left" : "right"}`;
          busEl.onclick = () => openDrawer(vId);
          document.body.appendChild(busEl);
        }
        busEl.src = getBusIcon(bus.bustype);
        busEl.style.display = "block";
        busEl.style.top = `${posY}px`;
      });
    }

    async function main() {
      const busData = parseCSV(await loadCSV());
      const tick = () => {
        const n = new Date();
        drawBus(busData, n.getHours()*60 + n.getMinutes() + n.getSeconds()/60);
      };
      tick();
      setInterval(tick, 1000);
    }
    main();
  </script>
</body>
</html>
