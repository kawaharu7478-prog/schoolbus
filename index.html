<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バス走行位置表示 & 運用ドロワー</title>
  <style>
    body {
      margin: 0;
      background: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }

    #currentTime {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 20px;
      color: #333;
      z-index: 10;
    }

    .map {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .center-line {
      position: relative;
      width: 16px;
      height: 90vh;
      background-color: orange;
      border-radius: 4px;
    }

    .stop {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      background: white;
      padding: 3px 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: nowrap;
    }

    .bus {
      position: absolute;
      width: 80px;
      transition: top 1s linear;
      cursor: pointer; /* クリック可能であることを示す */
    }

    .left {
      left: calc(50% - 130px); 
    }

    .right {
      left: calc(50% + 100px);  
    }

    /* --- ドロワーUIのスタイル --- */
    #bottomSheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      width: 100%;
      height: 70vh;
      background: white;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
      z-index: 2000;
      transition: bottom 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
    }

    #drawerHandle {
      width: 100%;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #drawerHandle span {
      width: 40px;
      height: 5px;
      background: #ccc;
      border-radius: 5px;
    }

    #drawerScrollArea {
      padding: 0 20px 20px;
      overflow-y: auto;
      flex: 1;
    }

    #overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1500;
    }
  </style>
</head>
<body>

  <div id="currentTime"></div>

  <div class="map" id="mapContainer">
    <div class="center-line" id="line"></div>
    <div class="stop" id="koudai" style="top:10%;">広島工大</div>
    <div class="stop" id="itsukaichi" style="top:55%;">五日市駅南口</div>
    <div class="stop" id="depot" style="top:80%;">車庫</div>
  </div>

  <div id="overlay" onclick="closeDrawer()"></div>
  <div id="bottomSheet">
    <div id="drawerHandle" onclick="closeDrawer()">
      <span></span>
    </div>
    <div id="drawerScrollArea">
      <h3 id="drawerTitle" style="margin: 0 0 15px; border-bottom: 2px solid orange; padding-bottom: 10px;">車両詳細</h3>
      <div id="drawerContent">
        <img id="drawerImage" src="" style="width: 100%; height: auto; border-radius: 8px; display: block;">
      </div>
    </div>
  </div>

  <script>
    // 時計更新
    function updateClock() {
      const now = new Date();
      document.getElementById("currentTime").textContent = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // CSV読み込み
    async function loadCSV() {
      const response = await fetch(`timetable.csv?v=${Date.now()}`, { cache: "no-store" });
      const text = await response.text();
      return text.trim();
    }

    // アイコン取得（キャッシュ回避付き）
    function getBusIcon(type) {
      const timestamp = Date.now();
      if (type === "1") return `2995.png?v=${timestamp}`;
      if (type === "2") return `2694.png?v=${timestamp}`;
      return "";
    }

    // CSVパース
    function parseCSV(csv) {
      const lines = csv.split("\n");
      const header = lines[0].split(",");
      return lines.slice(1).map(line => {
        const values = line.split(",");
        const obj = {};
        header.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : "");
        return obj;
      });
    }

    function timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(":").map(Number);
      return h * 60 + m;
    }

    function interpolate(pos1, pos2, t1, t2, now) {
      if (t1 === null || t2 === null) return null;
      const minT = Math.min(t1, t2);
      const maxT = Math.max(t1, t2);
      if (now < minT || now > maxT) return null;
      const ratio = (now - t1) / (t2 - t1);
      return pos1 + (pos2 - pos1) * ratio;
    }

    // ドロワーを閉じる
    function closeDrawer() {
      document.getElementById("bottomSheet").style.bottom = "-100%";
      document.getElementById("overlay").style.display = "none";
    }

    // バス描画
    function drawBus(busData, nowMinutes) {
      const line = document.getElementById("line");
      const lineHeight = line.clientHeight;
      const stops = {
        "広島工大": line.offsetTop + 0.1 * lineHeight,
        "五日市駅南口": line.offsetTop + 0.55 * lineHeight,
        "車庫": line.offsetTop + 0.80 * lineHeight
      };

      busData.forEach((bus, idx) => {
        const bustype = bus.bustype;
        const dir = bus.direction;
        const startStop = dir === "up" ? "車庫" : "広島工大";
        const midStop = "五日市駅南口";
        const endStop = dir === "up" ? "広島工大" : "車庫";

        const times = [
          { stop: startStop, time: timeToMinutes(bus[startStop]) },
          { stop: midStop, time: timeToMinutes(bus[midStop]) },
          { stop: endStop, time: timeToMinutes(bus[endStop]) }
        ].filter(x => x.time !== null);

        if (times.length < 2) return;

        let posY = null;
        for (let i = 0; i < times.length - 1; i++) {
          const t1 = times[i], t2 = times[i + 1];
          posY = interpolate(stops[t1.stop], stops[t2.stop], t1.time, t2.time, nowMinutes);
          if (posY !== null) break;
        }

        const existing = document.getElementById(`bus-${idx}`);
        if (!posY) {
          if (existing) existing.style.display = "none";
          return;
        }

        let busEl = existing;
        if (!busEl) {
          busEl = document.createElement("img");
          busEl.id = `bus-${idx}`;
          busEl.src = getBusIcon(bustype);
          busEl.alt = "バス";
          busEl.className = `bus ${dir === "up" ? "left" : "right"}`;
          
          // クリックイベントの登録
          busEl.onclick = () => {
            const sheet = document.getElementById("bottomSheet");
            const overlay = document.getElementById("overlay");
            const drawerImg = document.getElementById("drawerImage");
            const drawerTitle = document.getElementById("drawerTitle");

            let vehicleId = (bustype === "1") ? "2995" : "2694";
            
            // ドロワーの中身を更新
            drawerImg.src = `${vehicleId}_unyou.png?v=${Date.now()}`;
            drawerTitle.textContent = `${vehicleId} 号車の本日の運用`;

            // ドロワーを表示
            sheet.style.bottom = "0";
            overlay.style.display = "block";
          };

          document.body.appendChild(busEl);
        }

        busEl.style.display = "block";
        busEl.style.top = `${posY}px`;
      });
    }

    async function main() {
      const csvText = await loadCSV();
      const busData = parseCSV(csvText);

      function tick() {
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
        drawBus(busData, nowMinutes);
      }

      tick();
      setInterval(tick, 1000);
    }

    main();
  </script>
</body>
</html>
